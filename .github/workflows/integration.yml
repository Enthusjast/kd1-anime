name: Integration

on:
  workflow_dispatch:
  schedule:
    # 每周在干净的 Ubuntu runner 上验证 XeLaTeX、CJK、FFmpeg 与 Manim 的真实联动。
    - cron: "47 4 * * 0"

permissions:
  contents: read

jobs:
  cairo-tex-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dvisvgm \
            ffmpeg \
            fonts-noto-cjk \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-xetex
      - name: Install pinned Manim and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "manim==0.20.1"
          python -m pip install -e .
      - name: Render a real CJK and MathTex scene
        run: |
          rm -rf "$RUNNER_TEMP/kd1-anime-media"
          python -m manim render \
            --renderer=cairo \
            -ql \
            --resolution 320,180 \
            --fps 15 \
            --disable_caching \
            --media_dir "$RUNNER_TEMP/kd1-anime-media" \
            tests/fixtures/integration_scene.py IntegrationScene
          video="$(find "$RUNNER_TEMP/kd1-anime-media" -type f -name 'IntegrationScene.mp4' -print -quit)"
          test -n "$video"
          test -s "$video"
          ffprobe -v error \
            -show_entries stream=width,height,avg_frame_rate \
            -of default=nw=1 "$video"
      - name: Run Manim health check and recipe corpus
        run: |
          manim checkhealth
          declare -a recipes=(
            "formula.py FormulaRecipe"
            "graph.py GraphRecipe"
            "geometry.py GeometryRecipe"
            "three_d.py ThreeDRecipe"
            "updater.py UpdaterRecipe"
            "camera.py CameraRecipe"
          )
          for recipe in "${recipes[@]}"; do
            read -r file scene <<< "$recipe"
            out="$RUNNER_TEMP/kd1-anime-recipes/${file%.py}"
            rm -rf "$out"
            mkdir -p "$out"
            python -m manim render \
              --renderer=cairo -ql --disable_caching \
              --format png --save_last_frame \
              --media_dir "$out" \
              "tests/fixtures/recipe_corpus/$file" "$scene"
            image="$(find "$out" -type f \( -name "$scene.png" -o -name "${scene}_*.png" \) -print -quit)"
            test -n "$image"
            test -s "$image"
          done
      - name: Validate installer and release resources
        run: |
          bash -n install.sh
          test -s resources/manim-0.20.1-knowledge.tar.gz
          python -m build --sdist
          archive="$(find dist -maxdepth 1 -name 'kd1_anime-*.tar.gz' -print -quit)"
          test -n "$archive"
          tar -tzf "$archive" | grep -F '/README.md'
