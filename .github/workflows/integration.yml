name: Integration

on:
  workflow_dispatch:
  schedule:
    # 每周在干净的 Ubuntu runner 上验证 XeLaTeX、CJK、FFmpeg 与 Manim 的真实联动。
    - cron: "47 4 * * 0"

permissions:
  contents: read

jobs:
  cairo-tex-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dvisvgm \
            ffmpeg \
            fonts-noto-cjk \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-xetex
      - name: Install pinned Manim and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "manim==0.20.1"
          python -m pip install -e . build
      - name: Render trusted fixed scenes through the run lifecycle
        run: python tools/render_trusted_scenes.py
      - name: Preserve trusted execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-local-render
          path: /tmp/kd1-trusted-render-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run Manim health check and recipe corpus
        run: |
          manim checkhealth
          declare -a recipes=(
            "formula.py FormulaRecipe"
            "graph.py GraphRecipe"
            "geometry.py GeometryRecipe"
            "three_d.py ThreeDRecipe"
            "updater.py UpdaterRecipe"
            "camera.py CameraRecipe"
          )
          for recipe in "${recipes[@]}"; do
            read -r file scene <<< "$recipe"
            out="$RUNNER_TEMP/kd1-anime-recipes/${file%.py}"
            rm -rf "$out"
            mkdir -p "$out"
            python -m manim render \
              --renderer=cairo -ql --disable_caching \
              --format png --save_last_frame \
              --media_dir "$out" \
              "tests/fixtures/recipe_corpus/$file" "$scene"
            image="$(find "$out" -type f \( -name "$scene.png" -o -name "${scene}_*.png" \) -print -quit)"
            test -n "$image"
            test -s "$image"
          done
      - name: Validate installer and release resources
        run: |
          bash -n install.sh
          test -s resources/manim-0.20.1-knowledge.tar.gz
          test -s resources/manim-0.20.1-recipes.tar.gz
          python -m build --sdist
          archive="$(find dist -maxdepth 1 -name 'kd1_anime-*.tar.gz' -print -quit)"
          test -n "$archive"
          tar -tzf "$archive" | grep -F '/README.md'
